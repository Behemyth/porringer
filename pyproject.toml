
[project]
description = ""
name = "porringer"

license = { text = "MIT" }

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.15"

dependencies = [
  "typer[all]>=0.27.3",
  "pydantic>=2.14.1",
  "platformdirs>=4.13.0",
  "userpath>=1.9.2",
  "packaging>=26.3",
  "aiohttp>=3.14.5",
  "stamina>=26.1.0",
  "filelock>=4.2.0",
]

[project.urls]
homepage = "https://github.com/synodic/porringer"
repository = "https://github.com/synodic/porringer"

[dependency-groups]
lint = ["ruff>=0.17.1", "pyrefly>=1.4.0"]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-subprocess>=1.6.0",
  "dirty-equals>=0.11",
  "hypothesis>=6.170.0",
  "pytest-socket>=0.8.1",
]
docs = ["zensical>=0.0.70"]

[project.entry-points."porringer.environment"]
pip = "porringer.plugin.pip.plugin:PIPEnvironment"
pipx = "porringer.plugin.pipx.plugin:PIPXEnvironment"
winget = "porringer.plugin.winget.plugin:WingetEnvironment"
uv = "porringer.plugin.uv.plugin:UvEnvironment"
npm = "porringer.plugin.npm.plugin:NPMEnvironment"
pnpm = "porringer.plugin.pnpm.plugin:PNPMEnvironment"
pim = "porringer.plugin.pim.plugin:PIMEnvironment"
pyenv = "porringer.plugin.pyenv.plugin:PyenvEnvironment"
brew = "porringer.plugin.brew.plugin:BrewEnvironment"
apt = "porringer.plugin.apt.plugin:APTEnvironment"
pdm = "porringer.plugin.pdm.plugin:PDMEnvironment"
poetry = "porringer.plugin.poetry.plugin:PoetryEnvironment"

[project.entry-points."porringer.scm"]
git = "porringer.plugin.git.plugin:GitScm"

[project.scripts]
porringer = "porringer.console.entry:app"
porr = "porringer.console.entry:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
testpaths = ["tests"]
markers = [
  "fresh_plugins: invalidate the plugin discovery cache before this test",
  "mock_packages: use a cached package list instead of real subprocess calls",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
  "D",     # pydocstyle
  "F",     # Pyflakes
  "I",     # isort
  "PL",    # pylint
  "UP",    # pyupgrade
  "E",     # pycodestyle
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "PT",    # flake8-pytest-style
  "ASYNC", # flake8-async (blocking calls on the event loop)
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.pyrefly]
project-excludes = ["examples"]

[tool.pdm]
plugins = ["-e file:///${PROJECT_ROOT}"]

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
analyze = "ruff check"
format = "ruff format"
format-check = "ruff format --check"
lint = { composite = ["analyze", "format-check", "type-check"] }
test = "pytest --disable-socket --allow-hosts=127.0.0.1,::1 tests"
type-check = "pyrefly check"
docs-schema = "porringer schema --output docs/schema.json"
generate = { composite = ["docs-schema", "zensical build --clean --strict"] }
serve = { composite = ["docs-schema", "zensical serve"] }

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
